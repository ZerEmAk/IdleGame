<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Idle Framework</title>

    <link rel="stylesheet" href="style.css">

    <!--
        PyScript is pinned to a specific release so an update cannot
        unexpectedly break the project. Change this deliberately later.
    -->
    <link
        rel="stylesheet"
        href="https://pyscript.net/releases/2026.7.2/core.css"
    >
    <script
        type="module"
        src="https://pyscript.net/releases/2026.7.2/core.js"
    ></script>
</head>

<body>
    <!-- =========================================================
         TOP BAR
         Static HTML is kept for the major page structure.
         Repeated game content is generated by Python.
         ========================================================= -->
    <header class="top-bar">
        <div class="top-bar-left">
            <strong>Idle Framework</strong>
            <span id="save-status">Starting...</span>
        </div>

        <div class="top-bar-right">
            <span id="version">v0.0.0</span>
            <button id="settings-button" type="button">Settings</button>
        </div>
    </header>

    <!-- =========================================================
         THREE-COLUMN LAYOUT
         Left: resources
         Middle: tabs / gameplay
         Right: event log
         ========================================================= -->
    <div class="game-layout">
        <aside class="panel resources-panel">
            <div class="panel-header">
                <h2>Resources</h2>
            </div>

            <!-- Python generates every resource row here. -->
            <div id="resources-list"></div>
        </aside>

        <main class="panel main-panel">
            <!-- Python generates tab buttons here. -->
            <nav id="tabs" class="tabs"></nav>

            <!-- Python generates tab panels here. -->
            <div id="tab-content"></div>
        </main>

        <aside class="panel log-panel">
            <div class="panel-header">
                <h2>Event Log</h2>
                <button id="clear-log" type="button">Clear</button>
            </div>

            <div id="event-log"></div>
        </aside>
    </div>

    <!-- =========================================================
         SETTINGS
         Kept static because there is only one settings dialog.
         ========================================================= -->
    <dialog id="settings-dialog">
        <h2>Settings</h2>

        <p>
            Saves are stored locally in this browser for this website.
        </p>

        <div class="settings-buttons">
            <button id="save-game" type="button">Save Now</button>
            <button id="load-game" type="button">Load Save</button>
            <button id="reset-game" type="button">Reset Game</button>
            <button id="close-settings" type="button">Close</button>
        </div>
    </dialog>

    <!--
        pyscript.json makes the Python modules in game/ available to
        the browser's Python environment.
    -->
    <script
        type="py"
        src="main.py"
        config="pyscript.json"
    ></script>
</body>
</html>
